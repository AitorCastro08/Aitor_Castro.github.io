<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A1 — Variables (estado + movimiento simple)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
  <script>
  
  //Variables
  let xS, yS, dS, rS, vS; //Sol
  let xL, yL, dL, rL, vL; //Luna
  let dia, mes, anio; // Calendario
  
  // Variables stikman
  let xP, yP; // Posición del personaje
  let S; // Tamaño base stikman
  let vP; // Velocidad Horizontal (izq/der)
  let groundy // Altura Suelo
  let vY; // velocidad vertical salto
  let jumpV; // Impulso de salto
  let g; // Gravedad
  let rHead; // Cabeza
  let bodyL; // Cuerpo
  let armL; //Brazos
  let legL; // Piernas
  let hipY; // Cadera encima de los piés
  let shoulderY; // hombros
  let headY; // Cabeza
  
  // Variable disparo
  let xD, yD, tD, vD, DisparoActivo;
  // Variables del obejtivo
  let xO, yO, wO, hO, vO
  
  
  function setup() {
  createCanvas(400, 400);
  
  // Calendario
  dia = 1
  mes = 1
  anio = 2025
   //Sol
  dS = min(width, height) * 0.20; 
  rS = dS/2; // Tamaño del Sol 
  xS = -rS; // Entra por izquierda
  yS = height/4; // Altura
  vS = width/420; // Velocidad Sol
  //Luna 
  dL = dS*0.5; // Tamaño de la Luna
  rL = dL/2; 
  xL = -width-rL; //Entra por izquierda mas lejos que el Sol
  yL = height/3; // Altura
  vL = width/450; //Velocidad Luna
  
  
  // disparo
  DisparoActivo = false 
  tD = width * 0.04
  vD = height/ 200
  xD = xP
  yD = yP
  
     // Objetivo
 xO = 0  
 yO = 0.25 * height  
 wO = 0.15 * width 
 vO = 0.004 * width 
  
    // Suelo (debe coincidir con el suelo que ya dibujas en T12)
groundY = 0.80 * height;
  
  // Stickman: tamaño y posición inicial
S  = 0.12 * min(width, height);
xP = 0.25 * width;
yP = groundY; // IMPORTANTE: aquí yP será la posición de los pies
 
 //Stickman
  rHead = 0.2*S;
  bodyL = 0.6*S;
  armL = 0.45*S;
  legL = 0.55*S;
 

// Movimiento horizontal
vP = width / 150;

// Salto (valores sencillos)
vY = 0;
jumpV = -0.030 * height;// impulso hacia arriba
g = 0.010 * height;// aceleración hacia abajo (pequeña)
 

 }
  
  function draw() { 
  
 
// Movimientos izquierda y derecha 
  if (keyIsDown(LEFT_ARROW)) {
  xP = xP - vP;
} 
else if (keyIsDown(RIGHT_ARROW)) {
  xP = xP + vP;
  }
  
  // Restricciones para que no salga del canvas
  if (xP < 0) {
  xP = 0;
}
if (xP > width) {
  xP = width;
}


// Reinicio del objetivo 

if (xO - 30 >  width) { 
xO = -0.1 * width; 
} 
// Fondo dependiendo de sol y  luna 
  if (xS<=width+rS) {
  background(0,0,255); // Azul
  }
  else { background(20); //Negro
  }
  
  // Suelo
  fill(0, 200, 80);
  rect(0, 0.8*height, width, 0.8*height);

 // Sol 
  noStroke(); 
  fill(245, 324, 10);
  circle(xS, yS, dS);
  
  // Luna 
  noStroke();
  fill(200);
  circle(xL, yL, dL);
  
  // Variables luna y sol
    xS = xS + vS;
  xL = xL + vL;
  if (xL > 2*width + rL) { 
  xL = -rL }
 
  // Variables Objetivo
  xO = xO + vO 
 
// dinujo stickman fuera del draw
dibujoStickman();

 // Calendario fuera del draw
calendario (); 
 
   // Dibujo disparo 
 DibujoDisparo(); 
 
 //Objetivo 
  Objetivo();
  
 
  
  // Movimiento del disparo
  
 if( DisparoActivo === true) {
 yD = yD - vD 
 } 
 
 if(yD < 0) {
 DisparoActivo = false 
 

}

 } 
// Calendario + reset de sol y Luna
  function calendario() { 
 
    stroke(0);
   strokeWeight(1);
   fill(255);


     textSize(20); //Tamaño letra
  text("fecha: (" + dia + ") (" + mes+ ") (" + anio + ")", 10, 20);
  
    
  // Reset día + incremento de mes
  if (dia > 30) { dia = 1; mes = mes + 1; } 
 
 // Reset de mes + incremento de año 
  if (mes > 12) { mes = 1; anio = anio + 1; }
  

  noStroke() // No trazo
  if (xS <= width + rS) {
  fill(0); // Dia 
  }
  else { fill(255); // Noche
  }
    if (xS > 2*width + rS) { 
  xS = -rS; 
   dia = dia + 1; 

   }
   
  } 
  
  // Dinujo de stickman 
   function dibujoStickman() {
  
  // Cabeza
fill(255);
circle(xP, headY, 2 * rHead);

// Tronco
stroke(255)
fill(240, 30)
line(xP, shoulderY, xP, hipY);


// Brazos (una línea horizontal + dos líneas hacia abajo)
stroke(255)
line(xP - 0.25*S, shoulderY, xP + 0.25*S, shoulderY);
line(xP - 0.25*S, shoulderY, xP - 0.25*S, shoulderY + armL);
line(xP + 0.25*S, shoulderY, xP + 0.25*S, shoulderY + armL);

// Piernas
line(xP, hipY, xP - 0.18*S, yP);
line(xP, hipY, xP + 0.18*S, yP);

 // Salto en función de Variables
   hipY = yP - legL;
  shoulderY = hipY - bodyL;
  headY = shoulderY - rHead;
  
    // logica salto
  yP=yP+vY;
  
  if(yP<0.55*height){
  vY=g;
  }
  if(yP>0.8*height)
  {
  yP=0.8*height;
  vY=0;
  }
}
  
  // Disparo dibujo 
  function DibujoDisparo() {


fill(100,30,90);
stroke(0);
strokeWeight(2)
circle (xD, yD, tD)
} 
 
     // Dibujo Objetivo
  function Objetivo () { 
  fill(255, 23, 30);
  stroke(0);
  strokeWeight(1);
  circle(xO, yO, wO); 
  } 

   // DISPARO (ESPACIO)
 function keyPressed() { 
 if (keyCode === 32) { 
    xD = xP;
    yD = shoulderY;
    DisparoActivo = true;
     }
	 
    // salto
  if (keyCode === UP_ARROW) {
    // Solo saltamos si estamos en el suelo
    if (yP === groundY) {
      vY = jumpV;
    }
	}
	} 
	
   
  
  
  
  
  


 </script>
  </body>
</html>
